name: advisor

on:
  schedule:
    - cron: "0 1 * * 1-5"    # 北京时间 09:00 早报
    - cron: "10 6 * * 1-5"   # 北京时间 14:10 尾盘决策（赶 15:00 截止）
    - cron: "30 12 * * 1-5"  # 北京时间 20:30 晚间复盘
    - cron: "0 2 * * 6"      # 北京时间 周六 10:00 周报
  workflow_dispatch:
    inputs:
      job:
        description: "任务"
        type: choice
        options: [refresh, morning, close, evening, weekly]
        default: refresh
  push:
    branches: [main]
    paths: ["data/holdings.enc.json", "web/**", "engine/**", ".github/workflows/advisor.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: advisor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: 缓存行情数据
        uses: actions/cache@v4
        with:
          path: .cache
          key: advisor-cache-${{ github.run_id }}
          restore-keys: advisor-cache-

      - run: pip install -r engine/requirements.txt

      - name: 选择任务
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
        run: |
          case "$SCHEDULE" in
            "0 1 * * 1-5")   J=morning ;;
            "10 6 * * 1-5")  J=close ;;
            "30 12 * * 1-5") J=evening ;;
            "0 2 * * 6")     J=weekly ;;
            *)               J="${INPUT_JOB:-refresh}" ;;
          esac
          case "$J" in morning|close|evening|weekly|refresh) ;; *) echo "非法任务 $J"; exit 1 ;; esac
          echo "job=$J" >> "$GITHUB_OUTPUT"

      - name: 运行分析
        working-directory: engine
        env:
          JOB: ${{ steps.pick.outputs.job }}
          ADVISOR_PASSPHRASE: ${{ secrets.ADVISOR_PASSPHRASE }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          # 手动触发时即使是周末/节假日也执行，方便测试推送
          FORCE=""; [ "$EVENT" = "workflow_dispatch" ] && FORCE="--force"
          if [ -f ../data/holdings.enc.json ] && [ -n "$ADVISOR_PASSPHRASE" ]; then
            python -m advisor run --job "$JOB" $FORCE
          else
            echo "尚未上传加密持仓或未配置口令，使用演示数据（手动触发时会推送带[演示]前缀的消息，用于测试推送配置）"
            PUSH="--no-push"; [ "$EVENT" = "workflow_dispatch" ] && PUSH=""
            python -m advisor run --job "$JOB" --demo --force $PUSH
          fi

      - name: 提交加密报告
        env:
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          git config user.name "advisor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git reset -q data/holdings.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "report: $JOB [skip ci]"
            git pull --rebase -q && git push -q
          fi

      - name: 生成站点
        working-directory: engine
        run: python -m advisor build-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
